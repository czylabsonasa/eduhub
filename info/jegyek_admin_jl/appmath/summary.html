<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
<style>
  table, td, th {
    border-collapse: collapse;
    font-family: sans-serif;
  }

  td, th {
    padding-bottom: 6px !important;
    padding-left: 8px !important;
    padding-right: 8px !important;
    padding-top: 6px !important;
  }

  tr.title td {
    padding-bottom: 2px !important;
  }

  tr.footnote td {
    padding-bottom: 2px !important;
  }

  tr.sourceNotes td {
    padding-bottom: 2px !important;
  }

  table > *:first-child > tr:first-child {
    border-top: 2px solid black;
  }

  table > *:last-child > tr:last-child {
    border-bottom: 2px solid black;
  }

  thead > tr:nth-child(1 of .columnLabelRow) {
    border-top: 1px solid black;
  }

  thead tr:last-child {
    border-bottom: 1px solid black;
  }

  tbody tr:last-child {
    border-bottom: 1px solid black;
  }

  tbody > tr:nth-child(1 of .summaryRow) {
    border-top: 1px solid black;
  }

  tbody > tr:nth-last-child(1 of .summaryRow) {
    border-bottom: 1px solid black;
  }

  tfoot tr:nth-last-child(1 of .footnote) {
    border-bottom: 1px solid black;
  }
</style>
</head>
<body>
<table>
  <thead>
    <tr class = "title">
      <td colspan = "3" style = "font-size: x-large; font-weight: bold; text-align: center;">2026-06-01 | 09:54:30.264</td>
    </tr>
    <tr class = "columnLabelRow">
      <th style = "font-weight: bold; text-align: right;">mark</th>
      <th style = "font-weight: bold; text-align: right;">freq</th>
      <th style = "font-weight: bold; text-align: right;">%</th>
    </tr>
  </thead>
  <tbody>
    <tr class = "dataRow">
      <td style = "text-align: right;">5</td>
      <td style = "text-align: right;">15</td>
      <td style = "text-align: right;">12.2</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">4</td>
      <td style = "text-align: right;">23</td>
      <td style = "text-align: right;">18.7</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">3</td>
      <td style = "text-align: right;">35</td>
      <td style = "text-align: right;">28.46</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">2</td>

      <td style = "text-align: right;">29.27</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">1</td>

    </tr>

      <td style = "text-align: right;">N/A</td>
      <td style = "text-align: right;">6</td>
      <td style = "text-align: right;"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
