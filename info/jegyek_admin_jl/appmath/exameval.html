<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
<style>
  table, td, th {
    border-collapse: collapse;
    font-family: sans-serif;
  }

  td, th {
    padding-bottom: 6px !important;
    padding-left: 8px !important;
    padding-right: 8px !important;
    padding-top: 6px !important;
  }

  tr.title td {
    padding-bottom: 2px !important;
  }

  tr.footnote td {
    padding-bottom: 2px !important;
  }

  tr.sourceNotes td {
    padding-bottom: 2px !important;
  }

  table > *:first-child > tr:first-child {
    border-top: 2px solid black;
  }

  table > *:last-child > tr:last-child {
    border-bottom: 2px solid black;
  }

  thead > tr:nth-child(1 of .columnLabelRow) {
    border-top: 1px solid black;
  }

  thead tr:last-child {
    border-bottom: 1px solid black;
  }

  tbody tr:last-child {
    border-bottom: 1px solid black;
  }

  tbody > tr:nth-child(1 of .summaryRow) {
    border-top: 1px solid black;
  }

  tbody > tr:nth-last-child(1 of .summaryRow) {
    border-bottom: 1px solid black;
  }

  tfoot tr:nth-last-child(1 of .footnote) {
    border-bottom: 1px solid black;
  }
</style>
</head>
<body>
<table>
  <thead>
    <tr class = "title">
      <td colspan = "2" style = "font-size: x-large; font-weight: bold; text-align: center;">2026-05-23 | 18:34:15.527</td>
    </tr>
    <tr class = "columnLabelRow">
      <th style = "font-weight: bold; text-align: right;">if total is &lt;</th>
      <th style = "font-weight: bold; text-align: right;">mark</th>
    </tr>
  </thead>
  <tbody>
    <tr class = "dataRow">
      <td style = "text-align: right;">45.0</td>
      <td style = "text-align: right;">1</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">65.0</td>
      <td style = "text-align: right;">2</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">80.0</td>
      <td style = "text-align: right;">3</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">95.0</td>
      <td style = "text-align: right;">4</td>
    </tr>
    <tr class = "dataRow">
      <td style = "text-align: right;">infinity</td>
      <td style = "text-align: right;">5</td>
    </tr>
  </tbody>
</table>
</body>
</html>
